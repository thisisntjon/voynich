      - {axis: impl, by: "roach r5 blind LOQO: core stream 13/15 quires (affix streams also 15/15, so the affix half is withdrawn)", ref: runs/roach-r5/results_r5.txt, claim: c-425, agrees: true, discharges: [X-01, X-07]}
    points:
      - {h: H-06, rel: for, strength: moderate, why: "content-like order in the vocabulary layer"}
      - {h: H-08, rel: against, strength: weak}
    related:
      - {f: F-12, rel: consistent-with, note: "resolved by s80: cores do carry weak order at matched size"}

  F-07:
    title: Hand-1 section vocabulary beats the generator and a bifolio null at the permutation floor, consistent with Schwartz 2026's weak section tint
    novelty: {label: extends, prior: "Montemurro & Zanette 2013, PLoS ONE (section keywords); Sterneck, Polish & Bowern 2021, Topic Modeling in the Voynich Manuscript; Schwartz 2026 s5.4 (0.2-0.3 bits/page tint, negative once quire is conditioned); Zattera 2022, CEUR 3313 (section differences are word-internal structure)", adds: "A within-hand-1 test against a generator and a bifolio null, with the signal carried by prefixes over shared cores; it agrees with Schwartz's weak tint rather than adding an independent content signal.", basis: "repo:workflow/research/B-prior-art.md; repo:research_notes/Voynich decipherment attempts and failures/hoax_vs_meaning.md; repo:research_notes/Voynich public source gaps/text_structure.md; medium confidence; filed 2026-10-19 under D-088"}
