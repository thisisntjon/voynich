# Findings graph: canonical relationship layer (D-058). Hand-edited; validate with
#   python tools/findings_graph.py check      and regenerate the view with   render
# Numbers stay in .inventory/registers/CLAIMS.md (cite ids, never restate values as new facts).
# Narrative stays in workflow/CONSTRAINTS-MAP.md. Process: workflow/TRIANGULATION.md.
#
# Evidence line = one independent way the finding was obtained. A line counts toward the grade only if
# it is verified (no `unverified: true`). `agrees: false` without `resolved:` makes the finding CONTESTED.

axes:
  data: another transliteration (ZL3b / RF1b / IT2a); same scans and glyph set, so never counts as independence
  seg: another segmenter or unit definition (SlotSegmenter, Zattera 2022, roach's own, whole words, alphabets)
  split: out-of-sample evidence (held-out pages, leave-one-quire-out, within-hand)
  method: a different statistic or design measuring the same property
  impl: independent code by a different analyst (Argon, roach, Daybreak, a published author's own pipeline)
  physical: measured from scan ink, not from a transcription
  external: published by others, read in a file we hold
  order: survives reading-order transformations (page, line or direction order unknown; s79)

hypotheses:
  H-01: {short: plain language, name: "Natural language written plainly (any known language)", status: disfavoured}
  H-02: {short: letter-in-core cipher, name: "Letter-level cipher with plaintext letters carried in the cores", status: "disfavoured again on the corrected statistic (s82 h2/rhythm, s83 too much core order)"}
  H-03: {short: verbose homophonic, name: "Verbose homophonic cipher: plaintext in the affixes, filler cores", status: "disfavoured as built"}
  H-04: {short: per-word table, name: "Per-word random-table cipher (Naibbe); per-line or sticky variant open", status: "excluded at default settings"}
  H-05: {short: table procedure, name: "Table-and-grille style procedure applied word by word within a line (Rugg family)", status: "weakened: weakened grille fails LOQO 0/15 (s71)"}
  H-06: {short: lexical system, name: "Word-level lexical system: cores are vocabulary (code, nomenclator or list-like content)", status: live}
  H-07: {short: self-citation, name: "Self-citation / local-memory generator (Timm and Schinner family)", status: "disfavoured as built"}
  H-08: {short: free gibberish, name: "Free human gibberish or glossolalia", status: disfavoured}
  H-09: {short: independent streams, name: "Superimposed independent streams (music, glyph classes)", status: excluded}
  H-10: {short: copied/liturgy/conlang, name: "Liturgy or charms, copying without understanding, historical conlangs", status: "excluded as tested"}
  H-11: {short: artefact, name: "Structure is an artefact of layout, drawings, transcription or alphabet", status: excluded}
  H-12: {short: ordered content, name: "Antidotary, alphabetical or zodiac-ordered content", status: "excluded as tested"}
  H-14: {short: table cipher with affix state, name: "Table cipher whose affix table is held for a line (sticky Naibbe family): carries plaintext", status: "narrowed (D-067): a fixed line-held table is contested by roach r6 and s98; a drifting table failed 0/15 (r9, L-217); what remains is a multi-scale state (D-067 amended)"}
  H-15: {short: transposition/nulls, name: "Transposition cipher or null-glyph insertion over a plain text", status: "disfavoured within tested scope (s75)"}
  H-13: {short: A/B languages, name: "Currier A and B are two languages or dialects (rather than two scribes)", status: "weakened, confounded"}
  H-16: {short: notation/shorthand, name: "Practitioner notation, shorthand or mnemonic manual: cores stand for ingredients, operations or categories a trained reader knew (red-team 2026-10-18; Sylvie guess 3)", status: "weakened, thin evidence (s97: constructed sigla control fails; no real shorthand text tested)"}
  H-17: {short: verbose orthography, name: "A natural language written in an invented verbose script with heavy abbreviation or misleading word boundaries (red-team 2026-10-18; Sylvie guess 4)", status: "weakened (s97): abbreviated, abjad and verbose-orthography controls fail; a line-held spelling-variant scheme gives in-line reuse but not order or locality"}
  H-18: {short: category conlang, name: "A private category-based constructed or esoteric language (philosophical-language style) (red-team 2026-10-18; Sylvie guess 5)", status: "live, untested; needs a falsifiable prediction"}

  H-19: {short: combinatory table, name: "The text is written from a combinatory or permutation table (Llull-style letter cells repeated across columns), with or without content (s107 2026-10-18)", status: "live; one 957-token OCR example shows in-line reuse; needs a full-size test and a construction from such a table against the joint profile"}
  H-20: {short: plant-physiology programme, name: "The pictures form one programme on plant life: cosmic influence, the plant's inner workings (biological section as medieval plant physiology / vegetative soul, Taiz & Taiz 2011), and plant parts as medicine (Panofsky 1954 via D'Imperio 1978)", status: "live, untested (subject-matter hypothesis; says nothing about the text mechanism)"}
assumptions:
  X-01: {statement: "SlotSegmenter's prefix/core/suffix are the right units", status: at-risk, basis: "vx01 A1 (c-592): no segmenter (Slot, Zattera, Seg_Affix2, Canonical) is adequate on planted books, so Zattera/Seg_Affix2 lines no longer discharge X-01 (2026-10-19); still discharged only by whole-word and roach r5 lines; s76: 4/5 slot calls hold under Zattera, A14 flips; A21 rare cores are boundary shifts"}
  X-02: {statement: "Transcribers' word spaces are the scribe's spaces", status: verified, basis: "s47 ink gaps kappa 0.87 (A19), scoped to s45 alignment"}
  X-03: {statement: "Line breaks in the transliteration are the scribe's lines", status: verified, basis: "s45 ink-detected lines reproduce A1 (c-359)"}
  X-04: {statement: "Bound page and quire order is the reading order", status: unverified, basis: "s79 c-421: only page drift and cross-page carryover rest on it"}
  X-05: {statement: "Lines read left to right and top to bottom", status: unverified, basis: "s79 c-421: line edges mirror under reversal; layout favours the transcribed direction (inference)"}
  X-06: {statement: "A plug-in MI excess can detect core order at the core-inventory size used", status: flipped, basis: "s80 c-420: at full inventory real languages read -0.10..-0.15 and positive once pooled; invalidated 2026-10-18"}
  X-07: {statement: "The 41 held-out pages are an uncontaminated test set", status: at-risk, basis: "D-056: reused many times; LOQO is primary, held-out pass = candidate only"}
  X-08: {statement: "Davis's hand assignments are correct", status: unverified, basis: "external palaeography; consistent with s60/s68 but not independently checked"}
  X-09: {statement: "The three transliterations agree on glyph identity well enough", status: verified, basis: "findings replicate on ZL3b/RF1b/IT2a; not independent scans"}

findings:
  F-01:
    title: Lines are units of the text
    novelty: {label: extends, prior: "Currier 1976 (line as functional unit, cited via R&T); Vogt 2012, The line as a functional unit; Timm 2014, arXiv 1407.6639; Rozanova & Temerev 2026, arXiv 2608.17096 s3.6; Steckley & Steckley 2024, arXiv 2404.13069", adds: "Matched-size comparison against Latin prose and verse corpora, reproduced on Kraken ink-detected lines and after drawing-gap removal.", basis: "repo:workflow/research/B-prior-art.md; high confidence; filed 2026-10-19 under D-088"}
    statement: >
      The line start carries its own vocabulary, 20x a Latin prose line at matched size; separable from verse corpora at
      >=500 lines but not from single short verse hands. Reproduced from ink-detected lines, on public data with new code,
      and robust to drawing gaps.
    map: [A1, dot1]
    claims: [c-306, c-313, c-316, c-317, c-330, c-331, c-349, c-359, c-409, c-318, c-319, c-348]
    status: standing
    load_bearing: true
    rests_on: [X-03]
    lines:
      - {axis: data, by: "ZL3b/RF1b/IT2a", ref: results_s18.txt, agrees: true}
      - {axis: impl, by: "roach r1, independent code on public data", ref: runs/roach-r1r2-raw/results_r1.txt, claim: c-349, agrees: true}
      - {axis: physical, by: "s45 kraken ink-detected line breaks, 127 pages", ref: results_s45.txt, claim: c-359, agrees: true}
      - {axis: method, by: "s65 drawing gaps removed or split", ref: results_s65.txt, claim: c-409, agrees: true}
      - {axis: order, by: "s79: line-edge marking mirrors under reversal (one end of the line is marked)", ref: results_s79.txt, claim: c-421, agrees: true}
    points:
      - {h: H-01, rel: against, strength: strong, why: "real prose lines show almost no line-initial profile"}
      - {h: H-11, rel: against, strength: moderate, why: "survives ink lines and drawing-gap removal"}

  F-02:
    title: The line-start effect is paragraph gallows plus a line-start vocabulary; line ends are verse-like
    novelty: {label: replicates, prior: "Currier 1976; Timm 2014 (86% of paragraphs gallows-initial); Rozanova & Temerev 2026 s3.6 (paragraph-first vs ordinary lines); tavie/Stafford, voynich.ninja thread 4343 (2024); RN-Top PR #5 2026 (re-lining control); Ponzi line-position analyses (forum/blog)", adds: "Essentially a re-finding (our own prior-art review demotes it as replication); the only addition is a rhymed-verse control showing line-final m/g earns no credit.", basis: "repo:workflow/research/B-prior-art.md; own-knowledge (Ponzi); medium confidence; filed 2026-10-19 under D-088"}
    statement: Line-final m/g flourishes are matched by rhymed verse, so line ends earn no credit; line starts do. Holds across all three transliterations, 14/15 LOQO quires, and s45 ink-detected lines (s86).
    map: [A2]
    claims: [c-314, c-527]
    status: standing
    lines:
      - {axis: method, by: "m5 line anatomy and s17 verse corpora", ref: results_m5_line_anatomy.txt, agrees: true}
      - {axis: data, by: "Argon s86 Part 3A 3 transliterations (ZL3b, RF1b, IT2a) [POST-HOC 2026-10-19: results overwritten after stub re-stamp, phase8-1-rerun-audit.md; stops counting until a blind replication passes]", ref: results_s86.txt, claim: c-527, agrees: true, unverified: true}
      - {axis: split, by: "Argon s86 Part 3A 15-quire LOQO (14/15 quires on all 3 transliterations) [POST-HOC 2026-10-19: results overwritten after stub re-stamp, phase8-1-rerun-audit.md; stops counting until a blind replication passes]", ref: results_s86.txt, claim: c-527, agrees: true, unverified: true}
      - {axis: physical, by: "Argon s86 Part 3A s45 kraken ink-detected lines on 127 Yale scan pages [POST-HOC 2026-10-19: results overwritten after stub re-stamp, phase8-1-rerun-audit.md; stops counting until a blind replication passes]", ref: results_s86.txt, claim: c-527, agrees: true, unverified: true}
    related:
      - {f: F-01, rel: refines}

  F-03:
    title: Cross-space coupling is adjacent ordering, strongest in Currier B, and cheap to make
    novelty: {label: extends, prior: "Currier 1976; Smith & Ponzi 2019, Cryptologia 43.6, Glyph combinations across word breaks; Rozanova & Temerev 2026 (edge MI 0.197 bits; A 0.137, B 0.248); Parisel 2026, arXiv 2604.19762; Feaster 2022, CEUR 3313 (positional account of y.q/n.q)", adds: "Short Latin verse at matched size reaches B, and any skewed edge table regenerates the coupling, so it constrains little.", basis: "repo:workflow/research/B-prior-art.md; repo:workflow/research/x01-published-first.md; high confidence; filed 2026-10-19 under D-088"}
    statement: >
      Last glyph to next first glyph is coupled, B above every prose manuscript but inside short Latin verse at matched size,
      with no caesura or rhyme. Any skewed edge table regenerates it, so it constrains the mechanism only through which
      table and why A and B differ.
    map: [A3, A4]
    claims: [c-307, c-325, c-327, c-308, c-350, c-387, c-372, c-300, c-358, c-368]
    status: standing
    lines:
      - {axis: data, by: "3 transliterations", ref: results_s20.txt, agrees: true}
      - {axis: impl, by: "roach r2 (marginal: B similar to Priapea)", ref: runs/roach-r1r2-raw/results_r2.txt, claim: c-350, agrees: true}
      - {axis: external, by: "Rozanova and Temerev 2026: edge information stops at line breaks", ref: data/external/papers/rozanova_temerev_2026_arxiv_2608.17096.txt, agrees: true}
    points:
      - {h: H-13, rel: for, strength: weak, why: "A couples like prose, B like metrical Latin"}

  F-04:
    title: Word lengths follow a rhythm inside lines that stops at line breaks
    novelty: {label: extends, prior: "Gaskell & Bowern 2022, Gibberish after all? (flattened word-length autocorrelation); quimqu & nablator, voynich.ninja 2025 (lag-1 r +0.16, line-break contrast); Vogt 2012 (second word shorter); Steckley & Steckley 2024 (line-position lengths)", adds: "A shuffle-controlled within-line Moran I with cross-line share under 3%, replicated by independent code; roach r12 shows Kalevala verse has it too (c-456).", basis: "repo:workflow/FINDINGS-GRAPH.yaml (F-04 lines; status_board limits); repo:workflow/research/x01-published-first.md; repo:.inventory/registers/CLAIMS.md c-456; medium confidence; filed 2026-10-19 under D-088"}
    statement: >
      Neighbouring words in a line have related lengths (Moran I 0.157 vs shuffle q99 0.081); cross-line share <3 %; no
      language or human-gibberish control we built reproduces it, but Kalevala metrical verse does (15/15 blocks, c-456);
      no producer we built predicts it.
    map: [A5, A13, dot3]
    claims: [c-295, c-305, c-320, c-328, c-329, c-335, c-336, c-360, c-409, c-414, c-380, c-456]
    status: standing
    load_bearing: true
    rests_on: [X-03]
    lines:
      - {axis: data, by: "3 transliterations", ref: results_s21.txt, agrees: true}
      - {axis: impl, by: "Daybreak independent run (exact reproduction)", claim: c-320, agrees: true}
      - {axis: impl, by: "roach r3c, own code and segmenter, held-out pages: within-line only", ref: runs/roach-r3/results_r3.txt, claim: c-414, agrees: true}
      - {axis: physical, by: "s45 ink-derived word gaps: same sign and above its null (0.254), but outside the pre-set band 0.109-0.170, so the band check FAILS (c-360); corrected from agrees: true on 2026-10-19 under D-088", ref: results_s45.txt, claim: c-360, agrees: false, resolved: "direction and null test agree; only the pre-set magnitude band fails, so this line counts neither for nor against F-04"}
      - {axis: method, by: "s65 drawing-gap removal", ref: results_s65.txt, claim: c-409, agrees: true}
      - {axis: split, by: "roach r3 held-out pages", ref: runs/roach-r3/results_r3.txt, agrees: true}
      - {axis: order, by: "s79: Moran order-free under every transform", ref: results_s79.txt, claim: c-421, agrees: true}
      - {axis: external, by: "Voynich Ninja thread (quimqu, nablator 2025): global lag-1 word-length r +0.16, line-break contrast; per-line -0.07 reproduced and shown to be short-line bias (shuffle -0.153, excess +0.082)", ref: runs/explore/wordlen_perline_bias_20261018.txt, agrees: true, unverified: true}
      - {axis: impl, by: "roach r12 blind: within-line lag-1 length correlation positive on 12/15 (ZL) and 11/15 (IT) blocks, none across line breaks; Kalevala metrical verse 15/15, other natural texts <= 4/15", ref: runs/roach-r12/results_r12.txt, claim: c-456, agrees: true, note: "replicates the rhythm; not unique to the manuscript (metrical verse has it)"}
    controls:
      - {what: "64 language, verse and gibberish sidecars on real lines", ref: results_s17.txt, matched: true}
    points:
      - {h: H-01, rel: against, strength: strong, why: "Latin pools -0.03..+0.04, verse negative"}
      - {h: H-08, rel: against, strength: moderate, why: "gibberish 0.098, p 0.73 on the within-line form"}
      - {h: H-07, rel: against, strength: moderate, why: "s57 local-memory producer gives 0.02"}

  F-05:
    title: Characters predict the text better than its word list does
    novelty: {label: extends, prior: "Bennett 1976 (h2 2.22 vs 3.01-3.37, via voynich.nu); Lindemann & Bowern 2021, character entropy; Gaskell & Bowern 2022 (gibberish similarity)", adds: "A held-out character-model-vs-word-list comparison whose positive sign no language or encoded control shares, traced to core-dependent affixes.", basis: "repo:research_notes/Voynich decipherment attempts and failures/computational_recent.md; repo:.inventory/registers/CLAIMS.md c-224; medium confidence; filed 2026-10-19 under D-088"}
    statement: >
      CHARWIN is positive (+0.094), outside every language (-0.45..-0.74) and encoded control; the sign is shared only by
      human gibberish. Its sign comes from the affix layer (s58) and needs core-dependent affixes (s67).
    map: [A6]
    claims: [c-293, c-315, c-398]
    status: standing
    lines:
      - {axis: data, by: "3 transliterations", ref: results_n5.txt, agrees: true}
      - {axis: method, by: "s38 canonical scorer re-run by voynich-08", ref: runs/s38/rescore_n5_voynich08.txt, agrees: true}
      - {axis: impl, by: "Argon s75/s85 strictly normalized MDL bake-off on 15-quire LOQO (M1_char3_wb beats M0_unigram_renorm on 15/15 quires) [POST-HOC 2026-10-19: results overwritten after stub re-stamp, phase8-1-rerun-audit.md; stops counting until a blind replication passes]", ref: results_s85.txt, claim: c-522, agrees: true, unverified: true}
      - {axis: split, by: "15-quire LOQO and s45 127-page ink-verified subsets (s88 Part 2) [POST-HOC 2026-10-19: results overwritten after stub re-stamp, phase8-1-rerun-audit.md; stops counting until a blind replication passes]", ref: results_s88.txt, claim: c-529, agrees: true, unverified: true}
    points:
      - {h: H-01, rel: against, strength: strong}
      - {h: H-08, rel: for, strength: weak, why: "shared sign"}
    related:
      - {f: F-15, rel: explained-by, note: "the sign appears only when affixes depend on the core"}

  F-06:
    title: Cores carry held-out word-order structure (restated; the 'affixes carry none' half withdrawn by r5)
    novelty: {label: extends, prior: "Reddy & Knight 2011, What We Know About the Voynich Manuscript (8.85% residual next-word gain for B); Rozanova & Temerev 2026 Table 4 (token order 0.81%)", adds: "The residual is held out, survives a powered 7k-type habit generator, and sits in the core stream (the affix half was withdrawn by r5).", basis: "repo:workflow/FINDINGS-GRAPH.yaml; repo:workflow/CONSTRAINTS-MAP.md; repo:workflow/research/x01-published-first.md; medium confidence; filed 2026-10-19 under D-088"}
    statement: >
      A held-out next-word residual exists that a powered 7k-type habit generator does not reproduce; the affix streams
      carry none of it. Reddy and Knight report a comparable residual for B.
    map: [A7, A16]
    claims: [c-301, c-351]
    status: standing
    load_bearing: true
    rests_on: [X-01, X-07]
    lines:
